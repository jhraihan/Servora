upstream servorabd_app {
    server unix:/run/servorabd/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name servorabd.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name servorabd.example.com;

    ssl_certificate /etc/letsencrypt/live/servorabd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servorabd.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 6m;
    root /srv/servorabd/frontend/dist;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location = / {
        include /etc/nginx/snippets/servorabd-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/snippets/servorabd-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app.html;
    }

    location /assets/ {
        include /etc/nginx/snippets/servorabd-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://servorabd_app;
        include /etc/nginx/snippets/servorabd-proxy.conf;
    }

    location /admin/ {
        proxy_pass http://servorabd_app;
        include /etc/nginx/snippets/servorabd-proxy.conf;
    }

    location /static/ {
        alias /srv/servorabd/backend/staticfiles/;
        include /etc/nginx/snippets/servorabd-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* ^/media/(.+\.(?:jpe?g|png|webp))$ {
        alias /srv/servorabd/backend/media/$1;
        include /etc/nginx/snippets/servorabd-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /media/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
